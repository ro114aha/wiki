site_name: Engineering Wiki
site_description: Team knowledge base, stored as Markdown in Git
repo_url: https://github.com/ORG/engineering-wiki   # change to your GHE URL
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs          # top-level sections as tabs
    - navigation.sections      # grouped sidebar
    - navigation.instant       # fast page loads without full reload
    - navigation.top           # "back to top" button
    - navigation.footer        # previous / next links
    - toc.follow               # page outline tracks your scroll
    - search.suggest
    - search.highlight
    - content.code.copy        # copy button on code blocks
    - content.action.edit      # "edit this page" pencil -> GitHub
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

plugins:
  - search
  - git-revision-date-localized:   # "Last updated" on every page
      enable_creation_date: true
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started:
      - Repo structure: getting-started/repo-structure.md
      - Writing pages: getting-started/writing-pages.md
      - How to contribute: getting-started/contributing.md
  - Migration:
      - From Azure DevOps wiki: migration/from-azure-devops.md
  - Publishing:
      - GitHub Pages: publishing/github-pages.md
